<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romantic Memory Template</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
  overflow-x: hidden;
}

/* Romantic Falling Emojis Background */
.emoji-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.emoji {
  position: absolute;
  font-size: 20px;
  animation: fall linear infinite;
  opacity: 0.4;
}

@keyframes fall {
  0% { transform: translateY(-10vh); }
  100% { transform: translateY(110vh); }
}

/* Section */
.memory-section {
  position: relative;
  z-index: 1;
  background: linear-gradient(180deg, #0b0b0b, #1a0f18);
  padding: 100px 20px;
  text-align: center;
}

.memory-title {
  font-size: 2.2rem;
  color: #ff4d6d;
  margin-bottom: 60px;
  letter-spacing: 2px;
}

.memory-container {
  max-width: 800px;
  margin: auto;
}

.memory {
  margin-bottom: 70px;
  opacity: 0;
  transform: translateY(40px);
  transition: 0.8s ease;
}

.memory img {
  width: 100%;
  border-radius: 20px;
  filter: brightness(0.85) contrast(1.1);
  transition: 0.6s ease;
}

.memory:hover img {
  transform: scale(1.03);
  filter: brightness(1) contrast(1.2);
}

.memory p {
  color: #ddd;
  margin-top: 15px;
  font-size: 1rem;
  opacity: 0.8;
}

.template-note {
  margin-top: 80px;
  font-size: 1rem;
  color: #888;
}
</style>
</head>

<body>

<!-- Falling Emojis -->
<div class="emoji-bg"></div>

<section class="memory-section">
  <h2 class="memory-title">Through The Memories</h2>

  <div class="memory-container">

    <div class="memory"><img src="photo.jpg"><p>Caption 1</p></div>
    <div class="memory"><img src="photo.jpg"><p>Caption 2</p></div>
    <div class="memory"><img src="photo.jpg"><p>Caption 3</p></div>
    <div class="memory"><img src="photo.jpg"><p>Caption 4</p></div>
    <div class="memory"><img src="photo.jpg"><p>Caption 5</p></div>
    <div class="memory"><img src="photo.jpg"><p>Caption 6</p></div>
    <div class="memory"><img src="photo.jpg"><p>Caption 7</p></div>
    <div class="memory"><img src="photo.jpg"><p>Caption 8</p></div>
    <div class="memory"><img src="photo.jpg"><p>Caption 9</p></div>
    <div class="memory"><img src="photo.jpg"><p>Caption 10</p></div>

  </div>

  <div class="template-note">
    Say this is a template, your text will appear here
  </div>
</section>

<script>
// Scroll Reveal
const memories = document.querySelectorAll('.memory');

window.addEventListener('scroll', () => {
  memories.forEach(mem => {
    const position = mem.getBoundingClientRect().top;
    const screenHeight = window.innerHeight;

    if(position < screenHeight - 100){
      mem.style.opacity = 1;
      mem.style.transform = "translateY(0)";
    }
  });
});

// Romantic Emoji Generator
const emojiContainer = document.querySelector('.emoji-bg');
const emojis = ["❤️","💖","💘","💕","💞"];

for(let i = 0; i < 20; i++){
  const span = document.createElement("span");
  span.classList.add("emoji");
  span.innerText = emojis[Math.floor(Math.random()*emojis.length)];
  span.style.left = Math.random() * 100 + "vw";
  span.style.animationDuration = (5 + Math.random() * 5) + "s";
  span.style.fontSize = (15 + Math.random() * 20) + "px";
  emojiContainer.appendChild(span);
}
</script>

</body>
</html>
